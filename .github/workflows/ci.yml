name: CI

# Pull requests: lint the extension and build the Mac and iOS apps.
# Pushes to main (and manual runs): the same, then, once both are green, publish a signed,
# notarized Release build of the Mac app as a GitHub release, and upload a Release build of the
# iOS app to App Store Connect for TestFlight.
#
# Signing: the release job needs the repository secrets described in docs/ci-cd.md (run
# `just setup-signing`), and the TestFlight job an App Store Connect API key (run
# `just setup-testflight`). Unlike an ordinary app, an ad-hoc signed build is no use here: the app
# group ID is hardcoded to the team, and Safari only loads unsigned extensions in developer mode.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main part-way through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash # explicit so that `set -o pipefail` is on for `xcodebuild | xcbeautify`

env:
  XCODE_PROJECT: Let It Go/Let It Go.xcodeproj
  SCHEME: Let It Go
  IOS_SCHEME: Let It Go (iOS)
  DERIVED_DATA: build/DerivedData

jobs:
  lint:
    name: Lint extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # just is not on the runner image; install a pinned release and verify its checksum.
      - name: Install just
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          curl -fsSL -o "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  $RUNNER_TEMP/just.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          "$RUNNER_TEMP/just" --version

      - name: Lint
        run: '"$RUNNER_TEMP/just" lint'

  build:
    name: Build
    # Xcode 27 is required to open the project (objectVersion 110); this image is still in preview.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # There are no tests, so these only check that the apps and extensions compile.
      - name: Build (macOS)
        run: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build (iOS)
        run: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  release:
    name: Publish release
    needs: [lint, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its asset
    env:
      ARCHIVE_PATH: build/LetItGo.xcarchive
      APP_PATH: build/LetItGo.xcarchive/Products/Applications/Let It Go.app
    steps:
      - name: Check signing secrets
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          missing=()
          [ -n "$CERTIFICATE_P12_BASE64" ] || missing+=(MACOS_SIGNING_CERTIFICATE_P12)
          [ -n "$CERTIFICATE_PASSWORD" ] || missing+=(MACOS_SIGNING_CERTIFICATE_PASSWORD)
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$APPLE_ID" ] || missing+=(NOTARY_APPLE_ID)
          [ -n "$APP_PASSWORD" ] || missing+=(NOTARY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing signing secrets::${missing[*]} not set. Run \`just setup-signing\` (see docs/ci-cd.md)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the build number is the commit count

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Same scheme as `just upload`: the commit count, which only goes up, plus the short hash.
      - name: Determine version
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          COMMIT=$(git rev-parse --short HEAD)
          marketing_version=$(
            xcodebuild -project "$XCODE_PROJECT" -scheme "$SCHEME" -configuration Release \
              -derivedDataPath "$DERIVED_DATA" -showBuildSettings 2>/dev/null \
              | awk -F' = ' '/^ *MARKETING_VERSION = /{print $2; exit}'
          )
          if [ -z "$marketing_version" ]; then
            echo "::error::Could not read MARKETING_VERSION from the Xcode project"
            exit 1
          fi
          {
            echo "marketing_version=$marketing_version"
            echo "build_number=$BUILD_NUMBER"
            echo "commit=$COMMIT"
            echo "tag=v${marketing_version}-build.${BUILD_NUMBER}-${COMMIT}"
            echo "asset=Let-It-Go-${marketing_version}-build.${BUILD_NUMBER}.zip"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"

      # The app group uses $(TeamIdentifierPrefix), which Developer ID can sign without a
      # provisioning profile. The overrides apply to the embedded extension too.
      - name: Archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          COMMIT: ${{ steps.version.outputs.commit }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            "GIT_COMMIT=$COMMIT" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER= \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            | xcbeautify --renderer github-actions

          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements - "$APP_PATH"
          codesign -d --entitlements - "$APP_PATH/Contents/PlugIns/Let It Go Extension.appex"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" "build/$ASSET"
          ls -lh "build/$ASSET"

      - name: Write release notes
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          {
            echo "Let It Go ${MARKETING_VERSION} (build ${BUILD_NUMBER}), built from ${GITHUB_SHA} on \`${GITHUB_REF_NAME}\`."
            echo
            echo "Download \`${ASSET}\`, unzip it, move \`Let It Go.app\` to your Applications folder and open it,"
            echo "then turn on the extension in Safari → Settings → Extensions."
            echo
          } > build/release-notes.md
          cat build/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: Let It Go ${{ steps.version.outputs.marketing_version }} (${{ steps.version.outputs.build_number }})
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          extra_flags=()
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            extra_flags+=(--latest)
          else
            extra_flags+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists (re-run); replacing its asset"
            gh release upload "$TAG" "build/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "build/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file build/release-notes.md \
              --generate-notes \
              "${extra_flags[@]}"
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  testflight:
    name: Upload to TestFlight
    needs: [lint, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARCHIVE_PATH: build/LetItGo-iOS.xcarchive
      EXPORT_PATH: build/LetItGo-iOS
    steps:
      - name: Check App Store Connect secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=()
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$API_KEY_P8_BASE64" ] || missing+=(APP_STORE_CONNECT_API_KEY_P8)
          [ -n "$API_KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$API_ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing App Store Connect secrets::${missing[*]} not set. Run \`just setup-testflight\` (see docs/ci-cd.md)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the build number is the commit count

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Same scheme as the Mac release and `just upload-ios`. App Store Connect refuses a build
      # number it has already seen, so re-running this job for a commit it has already uploaded
      # fails at the upload.
      - name: Determine version
        id: version
        run: |
          {
            echo "build_number=$(git rev-list --count HEAD)"
            echo "commit=$(git rev-parse --short HEAD)"
          } | tee -a "$GITHUB_OUTPUT"

      # Outside the checkout, and removed at the end of the job.
      - name: Write API key
        env:
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Unsigned: when xcodebuild signs at archive time with the API key, it tries to create an
      # iOS App Development profile and Apple refuses the key ("Authentication failed"). The
      # key only works for exporting, so signing waits until then.
      - name: Archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          COMMIT: ${{ steps.version.outputs.commit }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            "GIT_COMMIT=$COMMIT" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # The export keeps the entitlements of the archive's signature, and an unsigned archive has
      # none, so the App Group the app and extension share would be lost. Sign them locally
      # (no certificate needed) with their entitlements, the extension before the app that
      # contains it; the export then re-signs both for the App Store.
      - name: Add entitlements
        run: |
          app="$ARCHIVE_PATH/Products/Applications/Let It Go.app"
          codesign --force --sign - \
            --entitlements "Let It Go/Let It Go Extension/Let It Go Extension (iOS).entitlements" \
            "$app/PlugIns/Let It Go Extension.appex"
          codesign --force --sign - --entitlements "Let It Go/Let It Go (iOS)/Let It Go.entitlements" "$app"
          codesign -d --entitlements - "$app" | grep group.dev.ettlin.nicolas.letitgo

      # Automatic signing with the API key: Xcode uses the team's cloud-managed distribution
      # certificate and creates or updates the App Store provisioning profiles itself, so no
      # certificate or profile is stored in the repository's secrets.
      # scripts/ExportOptions.plist, shared with `just upload`, has destination=upload, which sends
      # the build straight to App Store Connect. Once Apple has processed it, it shows up in
      # TestFlight for internal testers; the app declares no non-exempt encryption, so there is
      # no export compliance question to answer first.
      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Summarize
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$ARCHIVE_PATH/Info.plist")
          echo "Uploaded Let It Go for iOS ${marketing_version} (build ${BUILD_NUMBER}, ${COMMIT}) to App Store Connect. It appears in TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
