<!doctype html>
<!-- The real Chrome popup, chrome/popup/popup.html, with a stand-in for its
     settings.js so it shows a custom redirect target outside the extension.
     store.html shows it in an iframe. Keep the markup in step with
     popup.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../chrome/popup/popup.css">
  <style>
    /* No animation in a still: the flakes are drawn once by popup.js. */
    #feedback { transition: none; }
  </style>
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <main>
    <img class="icon" src="../../chrome/icons/icon-256.png" alt="">
    <h1>Let It Go</h1>
    <label class="redirect">
      <span>Redirect go/ to</span>
      <span class="field">
        <input id="redirect-base" type="text" placeholder="http://go" spellcheck="false" autocomplete="off">
        <span id="feedback" class="saved" aria-live="polite">✓</span>
      </span>
    </label>
  </main>
  <script>
    // Same snow every time.
    let seed = 11;
    Math.random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const params = new URLSearchParams(location.search);
    async function loadRedirectBase() { return params.get("base") || "http://go"; }
    async function saveRedirectBase() {}
  </script>
  <script src="../../chrome/popup/popup.js"></script>
</body>
</html>
