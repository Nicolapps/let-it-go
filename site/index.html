<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let It Go</title>
  <meta name="description" content="A Safari extension that opens go/ links instead of searching for them.">
  <link rel="icon" href="icon.webp">
  <style>
    /* The app window's look: always dark, on the app icon's gradient. */
    :root {
      color-scheme: dark;
      --text: #fff;
      --label: rgb(255 255 255 / 0.75);
      --faint: rgb(255 255 255 / 0.5);
      --title-shadow: rgb(14 15 51 / 0.55);
      --icon-shadow: rgb(106 106 184 / 0.6);
      --bar-bg: rgb(30 30 34 / 0.85);
      --bar-border: rgb(255 255 255 / 0.12);
      --accent: #66d4cf;
      --background:
        radial-gradient(60% 45% at 50% 40%, rgb(106 106 184 / 0.95), transparent),
        radial-gradient(55% 45% at 100% 100%, rgb(192 112 184 / 0.85), transparent),
        radial-gradient(50% 40% at 0% 100%, rgb(111 128 194 / 0.7), transparent),
        radial-gradient(45% 35% at 50% 100%, rgb(106 63 152 / 0.8), transparent),
        linear-gradient(to bottom, #0e0f33, #1d1c5c 45%, #3b2d84);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background: #0e0f33;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--background);
      z-index: -2;
    }

    #snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 64px 16px 32px;
      text-align: center;
    }

    .icon {
      width: 128px;
      height: 128px;
      filter: drop-shadow(0 8px 24px var(--icon-shadow));
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 3px 10px var(--title-shadow);
    }

    .tagline {
      margin: -12px 0 0;
      max-width: 30em;
      font-size: 20px;
      color: var(--label);
      text-wrap: balance;
    }

    code {
      font: 0.95em ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* A Safari address bar typing a go/ link, then landing on it. */
    .demo {
      width: min(440px, 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--bar-border);
      border-radius: 12px;
      background: var(--bar-bg);
      text-align: left;
      font-size: 15px;
    }

    .bar svg {
      flex-shrink: 0;
      color: var(--faint);
    }

    .input {
      display: flex;
      align-items: center;
      gap: 1px;
      min-width: 0;
    }

    #typed {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #caret {
      width: 2px;
      height: 18px;
      flex-shrink: 0;
      background: var(--accent);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .result {
      display: flex;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      color: var(--label);
      transition: opacity 250ms ease-out, transform 250ms ease-out;
    }

    .result.hidden {
      opacity: 0;
      transform: translateY(-4px);
    }

    .result strong {
      color: var(--accent);
      font-weight: 600;
    }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid rgb(255 255 255 / 0.25);
      border-radius: 999px;
      background: rgb(255 255 255 / 0.12);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      transition: background-color 150ms ease-out, transform 150ms ease-out;
    }

    .download:hover {
      background: rgb(255 255 255 / 0.2);
    }

    .download:active {
      transform: scale(0.97);
    }

    .download:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .fine {
      margin: -14px 0 0;
      font-size: 14px;
      color: var(--faint);
    }

    footer {
      padding: 24px 16px 32px;
      text-align: center;
      font-size: 14px;
      color: var(--faint);
    }

    footer a {
      color: var(--label);
    }

    @media (prefers-reduced-motion: reduce) {
      #caret {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <img class="icon" src="icon.webp" width="128" height="128" alt="">
    <h1>Let It Go</h1>
    <p class="tagline">A Safari extension that opens <code>go/</code> links instead of searching for them.</p>

    <div class="demo" aria-hidden="true">
      <div class="bar">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="6" cy="6" r="4.5"/><path d="m9.5 9.5 3 3"/>
        </svg>
        <span class="input"><span id="typed"></span><span id="caret"></span></span>
      </div>
      <div class="result hidden" id="result">→ <strong id="target"></strong></div>
    </div>

    <a class="download" href="https://github.com/Nicolapps/let-it-go/releases/latest">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2v9M4 7.5 8 11.5l4-4M3 14h10"/>
      </svg>
      Download for Mac
    </a>
    <p class="fine">Free · macOS 15 or later · Google, Bing, DuckDuckGo, Yahoo and Ecosia</p>
  </main>

  <footer>
    <a href="https://github.com/Nicolapps/let-it-go">Source on GitHub</a>
  </footer>

  <script>
    // MARK: - Address bar demo

    // Types a go/ link, shows where it lands, then moves on to the next one.
    const links = ["go/standup", "go/oncall", "go/docs/onboarding", "go/lunch"];
    const typed = document.getElementById("typed");
    const result = document.getElementById("result");
    const target = document.getElementById("target");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function playDemo() {
      for (let i = 0; ; i = (i + 1) % links.length) {
        const link = links[i];
        target.textContent = "http://" + link;
        if (reduceMotion.matches) {
          typed.textContent = link;
          result.classList.remove("hidden");
          return;
        }
        for (let n = 1; n <= link.length; n++) {
          typed.textContent = link.slice(0, n);
          await wait(70 + Math.random() * 50);
        }
        await wait(400);
        result.classList.remove("hidden");
        await wait(2000);
        result.classList.add("hidden");
        typed.textContent = "";
        await wait(500);
      }
    }

    playDemo();

    // MARK: - Snowfall

    // A few slow, soft flakes drifting down behind the content, like the app's.
    const canvas = document.getElementById("snow");
    const context = canvas.getContext("2d");
    const flakes = Array.from({ length: 70 }, () => ({
      x: Math.random(),
      phase: Math.random(),
      speed: 0.02 + Math.random() * 0.04,
      size: 1.5 + Math.random() * 2.5,
      opacity: 0.15 + Math.random() * 0.4,
      sway: 4 + Math.random() * 10,
    }));

    function drawSnow(time) {
      const scale = devicePixelRatio;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== width * scale || canvas.height !== height * scale) {
        canvas.width = width * scale;
        canvas.height = height * scale;
      }
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, width, height);

      const t = time / 1000;
      for (const flake of flakes) {
        const progress = (flake.phase + t * flake.speed) % 1;
        const y = progress * (height + 20) - 10;
        const x = flake.x * width + Math.sin(t * 0.6 + flake.phase * 10) * flake.sway;
        context.beginPath();
        context.arc(x + flake.size / 2, y + flake.size / 2, flake.size / 2, 0, Math.PI * 2);
        context.fillStyle = `rgb(255 255 255 / ${flake.opacity})`;
        context.fill();
      }
      if (!reduceMotion.matches) requestAnimationFrame(drawSnow);
    }

    requestAnimationFrame(drawSnow);
    reduceMotion.addEventListener("change", () => requestAnimationFrame(drawSnow));
  </script>
</body>
</html>
