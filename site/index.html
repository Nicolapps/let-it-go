<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let It Go</title>
  <meta name="description" content="A Safari extension that opens go/ links instead of searching for them.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* The app window's look: always dark, on the app icon's gradient. */
    :root {
      color-scheme: dark;
      --text: #fff;
      --label: rgb(255 255 255 / 0.75);
      --faint: rgb(255 255 255 / 0.5);
      --shadow: 14 15 51;
      --bar-bg: rgb(30 30 34 / 0.85);
      --bar-border: rgb(255 255 255 / 0.12);
      --accent: #66d4cf;
      --background:
        radial-gradient(60% 45% at 50% 40%, rgb(106 106 184 / 0.95), transparent),
        radial-gradient(55% 45% at 100% 100%, rgb(192 112 184 / 0.85), transparent),
        radial-gradient(50% 40% at 0% 100%, rgb(111 128 194 / 0.7), transparent),
        radial-gradient(45% 35% at 50% 100%, rgb(106 63 152 / 0.8), transparent),
        linear-gradient(to bottom, #0e0f33, #1d1c5c 45%, #3b2d84);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      overflow-x: clip;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background: #0e0f33;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--background);
      z-index: -2;
    }

    #snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 64px 16px 0;
      text-align: center;
    }

    .icon {
      width: 128px;
      height: 128px;
      /* A tight contact shadow under a soft, wide one, like the Dock's. */
      filter:
        drop-shadow(0 1px 2px rgb(var(--shadow) / 0.3))
        drop-shadow(0 12px 24px rgb(var(--shadow) / 0.4));
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 1px 2px rgb(var(--shadow) / 0.2), 0 2px 16px rgb(var(--shadow) / 0.2);
    }

    .tagline {
      margin: -12px 0 0;
      max-width: 30em;
      font-size: 20px;
      color: var(--label);
      text-wrap: balance;
    }

    code {
      font: 0.95em ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* A Safari 26 window on an empty Start Page, standing at the bottom of the
       screen with its lower part out of view. Sizes are measured from a
       screenshot of Safari, in points. It follows the system appearance. */
    .stage {
      display: flex;
      justify-content: center;
      width: 100%;
      height: 340px;
      padding: 60px 16px 0;
      overflow-x: visible;
      overflow-y: clip;
    }

    .safari {
      --toolbar: #eaecee;
      --page: #e0e2e4;
      --separator: #cacbcd;
      --control-top: #fdfdfd;
      --control-bottom: #eef1f2;
      --control-border: rgb(0 0 0 / 0.24);
      --control-highlight: #fff;
      --icon: #000;
      --icon-disabled: #a4a6a8;
      --placeholder: #808080;
      --text: #000;
      --tab-text: #404244;
      --tab-fill: #f6f7f9;
      --window-border: rgb(0 0 0 / 0.25);
      --window-highlight: transparent;

      flex-shrink: 0;
      width: min(1101px, 100%);
      height: 420px;
      overflow: hidden;
      border-radius: 16px;
      background: var(--page);
      box-shadow:
        0 0 0 0.5px var(--window-border),
        inset 0 0.5px 0 var(--window-highlight),
        0 4px 12px rgb(var(--shadow) / 0.2),
        0 24px 60px rgb(var(--shadow) / 0.45);
      color: var(--text);
      text-align: left;
      font-size: 13px;
    }

    @media (prefers-color-scheme: dark) {
      .safari {
        --toolbar: #2c2c2f;
        --page: #1e1e20;
        --separator: #000;
        --control-top: #3d3d41;
        --control-bottom: #343438;
        --control-border: rgb(0 0 0 / 0.5);
        --control-highlight: rgb(255 255 255 / 0.12);
        --icon: #fff;
        --icon-disabled: #6e6e73;
        --placeholder: #98989d;
        --text: #fff;
        --tab-text: #d8d8dc;
        --tab-fill: #38383c;
        --window-border: rgb(0 0 0 / 0.7);
        --window-highlight: rgb(255 255 255 / 0.15);
      }
    }

    .chrome {
      height: 90px;
      background: var(--toolbar);
      border-bottom: 0.5px solid var(--separator);
    }

    .toolbar {
      position: relative;
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 7.5px;
    }

    .lights {
      display: flex;
      gap: 9.5px;
      margin: 0 17px 0 11.5px;
    }

    .lights span {
      width: 13.5px;
      height: 13.5px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.2);
    }

    .lights span:nth-child(1) { background: #ff5f57; }
    .lights span:nth-child(2) { background: #febc2e; }
    .lights span:nth-child(3) { background: #28c840; }

    .control {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      height: 37px;
      border-radius: 999px;
      background: linear-gradient(var(--control-top), var(--control-bottom));
      box-shadow:
        0 0 0 0.5px var(--control-border),
        inset 0 0.5px 0 var(--control-highlight),
        inset 0 -0.5px 0 var(--control-highlight);
      color: var(--icon);
    }

    .control svg {
      flex-shrink: 0;
    }

    .sidebar {
      width: 64px;
      padding-left: 9px;
      gap: 12.5px;
      margin-right: 7px;
    }

    .nav {
      width: 74px;
      justify-content: space-between;
      padding: 0 15px;
      color: var(--icon-disabled);
    }

    .nav i {
      width: 1px;
      height: 17px;
      background: var(--control-border);
    }

    /* The address field is centred in the window (Safari has it 2pt right of
       centre, and its placeholder 3pt further), with the extension's button
       just left of it. */
    .address {
      position: absolute;
      left: 50%;
      width: 40.8%;
      transform: translateX(calc(-50% + 2px));
      justify-content: center;
      gap: 6px;
      padding: 0 9px 0 15px;
      color: var(--placeholder);
      font-weight: 500;
      transition: box-shadow 150ms ease-out;
    }

    .address.focused {
      justify-content: flex-start;
      padding: 0 11.5px;
      box-shadow:
        0 0 0 0.5px var(--control-border),
        0 0 0 3.5px rgb(0 122 255 / 0.5);
    }

    .extension {
      position: absolute;
      right: calc(50% + 20.4% + 7px - 2px);
      justify-content: center;
      width: 37px;
    }

    .extension img {
      width: 19px;
      height: 19px;
    }

    .input {
      display: flex;
      align-items: center;
      min-width: 0;
      white-space: nowrap;
    }

    #typed {
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    #caret {
      display: none;
      flex-shrink: 0;
      width: 1.5px;
      height: 16px;
      margin: 0 1px;
      background: #007aff;
      animation: blink 1s steps(1) infinite;
    }

    .focused #caret {
      display: block;
    }

    #typed:not(:empty) ~ #placeholder {
      display: none;
    }

    #placeholder {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Icons centred 35.75pt apart. */
    .actions {
      width: 148.5px;
      margin-left: auto;
      padding: 0 12.5px 0 11.5px;
      justify-content: space-between;
    }

    .actions .disabled {
      color: var(--icon-disabled);
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 30.5px;
      margin: 0 8px;
      border-radius: 999px;
      background: var(--tab-fill);
      box-shadow:
        0 0 0 0.5px var(--control-border),
        inset 0 0.5px 0 var(--control-highlight),
        0 1px 1.5px rgb(0 0 0 / 0.06);
      color: var(--tab-text);
    }

    /* Narrower windows drop the sidebar and back/forward buttons, then on
       phones the right-hand buttons too, and the field takes the room left. */
    @media (max-width: 1040px) {
      .sidebar,
      .nav {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .stage {
        height: 280px;
      }

      .actions {
        display: none;
      }

      .lights {
        margin-right: 12px;
      }

      .extension {
        position: static;
        margin-right: 7px;
      }

      .address {
        position: static;
        flex: 1;
        width: auto;
        min-width: 0;
        transform: none;
      }
    }

    /* Liquid Glass, as close as CSS gets: a frosted fill tinted violet and lighter at the top,
       a hairline rim that catches the light at the top left and bottom
       right, and a faint sheen along the top edge. */
    .download {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 30px;
      border-radius: 999px;
      background:
        linear-gradient(rgb(255 255 255 / 0.08), transparent 60%),
        rgb(160 150 255 / 0.24);
      -webkit-backdrop-filter: blur(16px) saturate(115%) brightness(1.15);
      backdrop-filter: blur(16px) saturate(115%) brightness(1.15);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.12),
        0 2px 10px rgb(var(--shadow) / 0.1);
      color: var(--text);
      font-size: 19px;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 1px 2px rgb(var(--shadow) / 0.2);
      -webkit-tap-highlight-color: transparent;
      transition: transform 200ms cubic-bezier(0.2, 0, 0, 1);
    }

    /* The rim: a 1px gradient ring cut out of a full-size gradient. */
    .download::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg,
        rgb(255 255 255 / 0.6),
        rgb(255 255 255 / 0.18) 25%,
        rgb(255 255 255 / 0.14) 75%,
        rgb(255 255 255 / 0.45));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Lights up on hover and press, like glass catching more light. */
    .download::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: rgb(255 255 255 / 0.1);
      opacity: 0;
      transition: opacity 200ms ease-out;
      pointer-events: none;
    }

    @media (hover: hover) {
      .download:hover::after {
        opacity: 1;
      }
    }

    .download:active {
      transform: scale(0.97);
    }

    .download:active::after {
      opacity: 1;
      background: rgb(255 255 255 / 0.16);
    }

    .download:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .source {
      margin: -8px 0 0;
      font-size: 15px;
    }

    .source a {
      color: var(--label);
      text-decoration: none;
    }

    .source a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      #caret {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <img class="icon" src="icon.webp" width="128" height="128" alt="">
    <h1>Let It Go</h1>
    <p class="tagline">Makes <code>go/</code> links work in Safari.</p>

    <a class="download" href="https://github.com/Nicolapps/let-it-go/releases/latest">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2v9M4 7.5 8 11.5l4-4M3 14h10"/>
      </svg>
      Download for Mac
    </a>
    <p class="source"><a href="https://github.com/Nicolapps/let-it-go">Source on GitHub</a></p>
  </main>

  <div class="stage" aria-hidden="true">
    <div class="safari">
      <div class="chrome">
        <div class="toolbar">
          <div class="lights"><span></span><span></span><span></span></div>
          <div class="control sidebar">
            <svg width="19" height="14.5" viewBox="0 0 19 14.5" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="0.7" y="0.7" width="17.6" height="13.1" rx="3.2"/>
              <path d="M7 1v12.5M3 4.2h1.8M3 6.6h1.8M3 9h1.8" stroke-linecap="round"/>
            </svg>
            <svg width="8.5" height="5" viewBox="0 0 8.5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m.75.75 3.5 3.5 3.5-3.5"/>
            </svg>
          </div>
          <div class="control nav">
            <svg width="7" height="13" viewBox="0 0 7 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.25.75.75 6.5l5.5 5.75"/></svg>
            <i></i>
            <svg width="7" height="13" viewBox="0 0 7 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m.75.75 5.5 5.75-5.5 5.75"/></svg>
          </div>
          <div class="control extension"><img src="favicon.png" alt=""></div>
          <div class="control address" id="address">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="5" cy="5" r="4.2"/><path d="m8.1 8.1 3.1 3.1"/>
            </svg>
            <span class="input"><span id="typed"></span><span id="caret"></span><span id="placeholder">Search or enter website name</span></span>
          </div>
          <div class="control actions">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="8.5" r="7.8"/><path d="M8.5 4.5v7.5M5.5 9l3 3 3-3"/>
            </svg>
            <svg class="disabled" width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 1v10.5M4 3.9 7 .9l3 3M4.6 6.7H2.6A1.9 1.9 0 0 0 .7 8.6v6.6a1.9 1.9 0 0 0 1.9 1.9h8.8a1.9 1.9 0 0 0 1.9-1.9V8.6a1.9 1.9 0 0 0-1.9-1.9h-2"/>
            </svg>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5.8v11.4M.8 6.5h11.4"/></svg>
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
              <rect x="4.6" y="4.6" width="11.7" height="11.7" rx="2.6"/>
              <path d="M12.4 4.6V3.3A2.6 2.6 0 0 0 9.8.7H3.3A2.6 2.6 0 0 0 .7 3.3v6.5a2.6 2.6 0 0 0 2.6 2.6h1.3"/>
            </svg>
          </div>
        </div>
        <div class="tab">
          <svg width="13.5" height="13" viewBox="0 0 14 13.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round">
            <path d="m7 .7 1.9 3.9 4.3.6-3.1 3 .7 4.3L7 10.5l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>
          </svg>
          Start Page
        </div>
      </div>
    </div>
  </div>

  <script>
    // MARK: - Address bar demo

    // Clicks into the address field, types a go/ link, leaves it up for a
    // moment, erases it, clicks away and moves on to the next one.
    const links = ["go/standup", "go/oncall", "go/docs/onboarding", "go/lunch"];
    const address = document.getElementById("address");
    const typed = document.getElementById("typed");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function playDemo() {
      for (let i = 0; ; i = (i + 1) % links.length) {
        const link = links[i];
        if (reduceMotion.matches) {
          address.classList.add("focused");
          typed.textContent = link;
          return;
        }
        await wait(900);
        address.classList.add("focused");
        await wait(600);
        for (let n = 1; n <= link.length; n++) {
          typed.textContent = link.slice(0, n);
          await wait(70 + Math.random() * 50);
        }
        await wait(1800);
        for (let n = link.length - 1; n >= 0; n--) {
          typed.textContent = link.slice(0, n);
          await wait(25);
        }
        await wait(300);
        address.classList.remove("focused");
      }
    }

    playDemo();

    // MARK: - Snowfall

    // A few slow, soft flakes drifting down behind the content, like the app's.
    const canvas = document.getElementById("snow");
    const context = canvas.getContext("2d");
    const flakes = Array.from({ length: 70 }, () => ({
      x: Math.random(),
      phase: Math.random(),
      speed: 0.02 + Math.random() * 0.04,
      size: 1.5 + Math.random() * 2.5,
      opacity: 0.15 + Math.random() * 0.4,
      sway: 4 + Math.random() * 10,
    }));

    function drawSnow(time) {
      const scale = devicePixelRatio;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== width * scale || canvas.height !== height * scale) {
        canvas.width = width * scale;
        canvas.height = height * scale;
      }
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, width, height);

      const t = time / 1000;
      for (const flake of flakes) {
        const progress = (flake.phase + t * flake.speed) % 1;
        const y = progress * (height + 20) - 10;
        const x = flake.x * width + Math.sin(t * 0.6 + flake.phase * 10) * flake.sway;
        context.beginPath();
        context.arc(x + flake.size / 2, y + flake.size / 2, flake.size / 2, 0, Math.PI * 2);
        context.fillStyle = `rgb(255 255 255 / ${flake.opacity})`;
        context.fill();
      }
      if (!reduceMotion.matches) requestAnimationFrame(drawSnow);
    }

    requestAnimationFrame(drawSnow);
    reduceMotion.addEventListener("change", () => requestAnimationFrame(drawSnow));
  </script>
</body>
</html>
