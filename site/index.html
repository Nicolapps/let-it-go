<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let It Go</title>
  <meta name="description" content="A Safari extension that opens go/ links instead of searching for them.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* The app window's look: always dark, on the app icon's gradient. */
    :root {
      color-scheme: dark;
      --text: #fff;
      --label: rgb(255 255 255 / 0.75);
      --faint: rgb(255 255 255 / 0.5);
      --shadow: 14 15 51;
      --bar-bg: rgb(30 30 34 / 0.85);
      --bar-border: rgb(255 255 255 / 0.12);
      --accent: #66d4cf;
      --background:
        radial-gradient(60% 45% at 50% 40%, rgb(106 106 184 / 0.95), transparent),
        radial-gradient(55% 45% at 100% 100%, rgb(192 112 184 / 0.85), transparent),
        radial-gradient(50% 40% at 0% 100%, rgb(111 128 194 / 0.7), transparent),
        radial-gradient(45% 35% at 50% 100%, rgb(106 63 152 / 0.8), transparent),
        linear-gradient(to bottom, #0e0f33, #1d1c5c 45%, #3b2d84);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background: #0e0f33;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--background);
      z-index: -2;
    }

    #snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 64px 16px 32px;
      text-align: center;
    }

    .icon {
      width: 128px;
      height: 128px;
      /* A tight contact shadow under a soft, wide one, like the Dock's. */
      filter:
        drop-shadow(0 1px 2px rgb(var(--shadow) / 0.3))
        drop-shadow(0 12px 24px rgb(var(--shadow) / 0.4));
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 1px 2px rgb(var(--shadow) / 0.2), 0 2px 16px rgb(var(--shadow) / 0.2);
    }

    .tagline {
      margin: -12px 0 0;
      max-width: 30em;
      font-size: 20px;
      color: var(--label);
      text-wrap: balance;
    }

    code {
      font: 0.95em ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* A Safari 26 window on an empty Start Page, its address field typing go/
       links. Light, like Safari in its default appearance. */
    .safari {
      width: min(760px, 100%);
      overflow: hidden;
      border-radius: 22px;
      background: #e1e1e4;
      box-shadow:
        0 0 0 0.5px rgb(0 0 0 / 0.35),
        0 4px 12px rgb(var(--shadow) / 0.2),
        0 24px 60px rgb(var(--shadow) / 0.45);
      color: #1d1d1f;
      text-align: left;
      font-size: 13px;
    }

    .chrome {
      background: #e9e9ec;
      border-bottom: 1px solid rgb(0 0 0 / 0.08);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px 8px 18px;
    }

    .lights {
      display: flex;
      gap: 8px;
      margin-right: 8px;
    }

    .lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.15);
    }

    .lights span:nth-child(1) { background: #ff5f57; }
    .lights span:nth-child(2) { background: #febc2e; }
    .lights span:nth-child(3) { background: #28c840; }

    .pill {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 14px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgb(255 255 255 / 0.6);
      box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.1), 0 1px 3px rgb(0 0 0 / 0.05);
      color: #3a3a3c;
    }

    .pill svg {
      flex-shrink: 0;
    }

    .sidebar {
      gap: 6px;
    }

    .nav {
      gap: 0;
      padding: 0 6px;
      color: #8e8e93;
    }

    .nav svg {
      margin: 0 6px;
    }

    .nav i {
      width: 1px;
      height: 16px;
      background: rgb(0 0 0 / 0.12);
    }

    .extension {
      justify-content: center;
      width: 30px;
      padding: 0;
      margin-left: 14px;
    }

    .extension img {
      width: 18px;
      height: 18px;
    }

    .address {
      flex: 1;
      flex-shrink: 1;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      color: #6e6e73;
      transition: box-shadow 150ms ease-out, background-color 150ms ease-out;
    }

    .address.focused {
      justify-content: flex-start;
      background: #fff;
      box-shadow: 0 0 0 3px #8c9cf0;
    }

    .input {
      display: flex;
      align-items: center;
      min-width: 0;
      white-space: nowrap;
    }

    #typed {
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1d1d1f;
    }

    #caret {
      display: none;
      flex-shrink: 0;
      width: 1.5px;
      height: 16px;
      margin: 0 1px;
      background: #3d5ce8;
      animation: blink 1s steps(1) infinite;
    }

    .focused #caret {
      display: block;
    }

    #typed:not(:empty) ~ #placeholder {
      display: none;
    }

    #placeholder {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .actions {
      gap: 18px;
    }

    .actions .dim {
      color: #b0b0b5;
    }

    .tabbar {
      padding: 0 8px 8px;
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 26px;
      border-radius: 999px;
      background: rgb(255 255 255 / 0.55);
      box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.12);
      color: #3a3a3c;
    }

    .page {
      height: 180px;
    }

    /* On phones, keep just the traffic lights, the extension and the field. */
    @media (max-width: 640px) {
      .sidebar,
      .nav,
      .actions {
        display: none;
      }

      .extension {
        margin-left: 0;
      }

      .page {
        height: 120px;
      }
    }

    /* Liquid Glass, as close as CSS gets: a frosted fill tinted violet and lighter at the top,
       a hairline rim that catches the light at the top left and bottom
       right, and a faint sheen along the top edge. */
    .download {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 30px;
      border-radius: 999px;
      background:
        linear-gradient(rgb(255 255 255 / 0.08), transparent 60%),
        rgb(160 150 255 / 0.24);
      -webkit-backdrop-filter: blur(16px) saturate(115%) brightness(1.15);
      backdrop-filter: blur(16px) saturate(115%) brightness(1.15);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.12),
        0 2px 10px rgb(var(--shadow) / 0.1);
      color: var(--text);
      font-size: 19px;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 1px 2px rgb(var(--shadow) / 0.2);
      -webkit-tap-highlight-color: transparent;
      transition: transform 200ms cubic-bezier(0.2, 0, 0, 1);
    }

    /* The rim: a 1px gradient ring cut out of a full-size gradient. */
    .download::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg,
        rgb(255 255 255 / 0.6),
        rgb(255 255 255 / 0.18) 25%,
        rgb(255 255 255 / 0.14) 75%,
        rgb(255 255 255 / 0.45));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Lights up on hover and press, like glass catching more light. */
    .download::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: rgb(255 255 255 / 0.1);
      opacity: 0;
      transition: opacity 200ms ease-out;
      pointer-events: none;
    }

    @media (hover: hover) {
      .download:hover::after {
        opacity: 1;
      }
    }

    .download:active {
      transform: scale(0.97);
    }

    .download:active::after {
      opacity: 1;
      background: rgb(255 255 255 / 0.16);
    }

    .download:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .source {
      margin: -8px 0 0;
      font-size: 15px;
    }

    .source a {
      color: var(--label);
      text-decoration: none;
    }

    .source a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      #caret {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <img class="icon" src="icon.webp" width="128" height="128" alt="">
    <h1>Let It Go</h1>
    <p class="tagline">Makes <code>go/</code> links work in Safari.</p>

    <div class="safari" aria-hidden="true">
      <div class="chrome">
        <div class="toolbar">
          <div class="lights"><span></span><span></span><span></span></div>
          <div class="pill sidebar">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="0.7" y="0.7" width="16.6" height="12.6" rx="3"/><path d="M6.5 1v12M2.8 4h1.8M2.8 6.3h1.8M2.8 8.6h1.8" stroke-linecap="round"/>
            </svg>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m1 1 4 4 4-4"/>
            </svg>
          </div>
          <div class="pill nav">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1 1 7l6 6"/></svg>
            <i></i>
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>
          </div>
          <div class="pill extension"><img src="favicon.png" alt=""></div>
          <div class="pill address" id="address">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <circle cx="6" cy="6" r="4.8"/><path d="m9.6 9.6 3.4 3.4"/>
            </svg>
            <span class="input"><span id="typed"></span><span id="caret"></span><span id="placeholder">Search or enter website name</span></span>
          </div>
          <div class="pill actions">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="7.2"/><path d="M8 4.2v7M5.2 8.5 8 11.3l2.8-2.8"/>
            </svg>
            <svg class="dim" width="14" height="17" viewBox="0 0 14 17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 1v10M4 3.8 7 .9l3 2.9M4.5 6.5H2.5a1.5 1.5 0 0 0-1.5 1.5v6.5A1.5 1.5 0 0 0 2.5 16h9a1.5 1.5 0 0 0 1.5-1.5V8a1.5 1.5 0 0 0-1.5-1.5h-2"/>
            </svg>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
              <rect x="4.5" y="4.5" width="10.8" height="10.8" rx="2.4"/><path d="M11.5 4.5V3.1A2.4 2.4 0 0 0 9.1.7H3.1A2.4 2.4 0 0 0 .7 3.1v6a2.4 2.4 0 0 0 2.4 2.4h1.4"/>
            </svg>
          </div>
        </div>
        <div class="tabbar">
          <div class="tab">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round">
              <path d="m7 1 1.8 3.9 4.2.5-3.1 2.9.8 4.2L7 10.4l-3.7 2.1.8-4.2L1 5.4l4.2-.5z"/>
            </svg>
            Start Page
          </div>
        </div>
      </div>
      <div class="page"></div>
    </div>

    <a class="download" href="https://github.com/Nicolapps/let-it-go/releases/latest">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2v9M4 7.5 8 11.5l4-4M3 14h10"/>
      </svg>
      Download for Mac
    </a>
    <p class="source"><a href="https://github.com/Nicolapps/let-it-go">Source on GitHub</a></p>
  </main>

  <script>
    // MARK: - Address bar demo

    // Clicks into the address field, types a go/ link, leaves it up for a
    // moment, erases it, clicks away and moves on to the next one.
    const links = ["go/standup", "go/oncall", "go/docs/onboarding", "go/lunch"];
    const address = document.getElementById("address");
    const typed = document.getElementById("typed");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function playDemo() {
      for (let i = 0; ; i = (i + 1) % links.length) {
        const link = links[i];
        if (reduceMotion.matches) {
          address.classList.add("focused");
          typed.textContent = link;
          return;
        }
        await wait(900);
        address.classList.add("focused");
        await wait(600);
        for (let n = 1; n <= link.length; n++) {
          typed.textContent = link.slice(0, n);
          await wait(70 + Math.random() * 50);
        }
        await wait(1800);
        for (let n = link.length - 1; n >= 0; n--) {
          typed.textContent = link.slice(0, n);
          await wait(25);
        }
        await wait(300);
        address.classList.remove("focused");
      }
    }

    playDemo();

    // MARK: - Snowfall

    // A few slow, soft flakes drifting down behind the content, like the app's.
    const canvas = document.getElementById("snow");
    const context = canvas.getContext("2d");
    const flakes = Array.from({ length: 70 }, () => ({
      x: Math.random(),
      phase: Math.random(),
      speed: 0.02 + Math.random() * 0.04,
      size: 1.5 + Math.random() * 2.5,
      opacity: 0.15 + Math.random() * 0.4,
      sway: 4 + Math.random() * 10,
    }));

    function drawSnow(time) {
      const scale = devicePixelRatio;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== width * scale || canvas.height !== height * scale) {
        canvas.width = width * scale;
        canvas.height = height * scale;
      }
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, width, height);

      const t = time / 1000;
      for (const flake of flakes) {
        const progress = (flake.phase + t * flake.speed) % 1;
        const y = progress * (height + 20) - 10;
        const x = flake.x * width + Math.sin(t * 0.6 + flake.phase * 10) * flake.sway;
        context.beginPath();
        context.arc(x + flake.size / 2, y + flake.size / 2, flake.size / 2, 0, Math.PI * 2);
        context.fillStyle = `rgb(255 255 255 / ${flake.opacity})`;
        context.fill();
      }
      if (!reduceMotion.matches) requestAnimationFrame(drawSnow);
    }

    requestAnimationFrame(drawSnow);
    reduceMotion.addEventListener("change", () => requestAnimationFrame(drawSnow));
  </script>
</body>
</html>
